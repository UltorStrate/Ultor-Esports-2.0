
name: Generate Better Auth Schema

on:
  workflow_dispatch:

jobs:
  generate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate SQLite schema
        run: npx auth generate --config ./src/auth.config.js --adapter drizzle --dialect sqlite --output ./auth-schema.ts --yes

      - name: Upload generated schema
        uses: actions/upload-artifact@v4
        with:
          name: better-auth-schema
          path: auth-schema.ts
