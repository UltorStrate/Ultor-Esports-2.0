
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aktuelle News, Ankündigungen und Updates von ULTOR ESPORTS.">
  <meta name="robots" content="index, follow">
  <title>News | ULTOR ESPORTS</title>

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/news/news.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="brand">
      <img src="/assets/logos/ultor-logo-transparent.png" alt="ULTOR ESPORTS Logo">
    </a>

    <nav class="main-nav">
      <a href="/">HOME</a>
      <a href="/about/">ABOUT</a>
      <a href="/teams/">TEAMS</a>
      <a href="/news/" class="active">NEWS</a>
      <a href="/#partners">PARTNERS</a>
      <a href="/#contact">CONTACT</a>
      <a href="/shop/" class="nav-shop">OFFICIAL SHOP <span>↗</span></a>
    </nav>
  </div>
</header>

<main>
  <section class="news-hero">
    <div class="container">
      <div class="section-label">ULTOR ESPORTS · UPDATES</div>
      <h1>THE LATEST <span>NEWS.</span></h1>
      <p>News, announcements and insights from the world of ULTOR ESPORTS.</p>
    </div>
  </section>

  <section class="news-overview">
    <div class="container">
      <div class="news-section-heading">
        <div>
          <div class="section-label">STAY INFORMED</div>
          <h2>ALL <span>UPDATES.</span></h2>
        </div>
      </div>

      <div id="newsStatus" class="news-status" aria-live="polite">
        News werden geladen …
      </div>

      <div id="newsGrid" class="news-grid"></div>

      <article id="newsArticle" class="news-article" hidden>
        <a href="/news/" class="news-back">← ALLE NEWS</a>
        <div id="articleContent"></div>
      </article>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 ULTOR ESPORTS. ALL RIGHTS RESERVED.</span>
      <div>
        <a href="/">HOME</a>
        <a href="/news/">NEWS</a>
      </div>
    </div>
  </div>
</footer>

<script src="/news/news.js" defer></script>
</body>
</html>
