<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ULTOR ESPORTS – Anmeldung</title>
  <link rel="stylesheet" href="/admin/admin.css?v=20261107-login-fix">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="/">ULTOR <span>ESPORTS</span></a>
    <p class="eyebrow">CONTENT MANAGEMENT SYSTEM</p>

    <div class="auth-tabs" role="tablist" aria-label="Anmeldung oder Registrierung">
      <button id="loginTab" class="tab-button active" type="button" role="tab" aria-selected="true">Anmelden</button>
      <button id="registerTab" class="tab-button" type="button" role="tab" aria-selected="false">Registrieren</button>
    </div>

    <section aria-labelledby="loginHeading">
      <form id="loginForm" autocomplete="on">
        <h1 id="loginHeading">Willkommen zurück.</h1>
        <p class="muted">Melde dich mit deinem ULTOR-Account an, um das CMS zu verwalten.</p>

        <label for="loginEmail">E-Mail-Adresse</label>
        <input id="loginEmail" name="email" type="email" autocomplete="username" placeholder="name@beispiel.de" required>

        <label for="loginPassword">Passwort</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Dein Passwort" required>

        <button class="primary-button full-width" type="submit">Anmelden</button>
      </form>
    </section>

    <section aria-labelledby="registerHeading">
      <form id="registerForm" autocomplete="on" hidden>
        <h1 id="registerHeading">Account erstellen.</h1>
        <p class="muted">Erstelle einen Zugang. Dein Konto muss anschließend vom Owner freigegeben werden.</p>

        <label for="registerName">Name</label>
        <input id="registerName" name="name" type="text" autocomplete="name" placeholder="Dein Name" required>

        <label for="registerEmail">E-Mail-Adresse</label>
        <input id="registerEmail" name="email" type="email" autocomplete="email" placeholder="name@beispiel.de" required>

        <label for="registerPassword">Passwort</label>
        <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Mindestens 8 Zeichen" required>

        <button class="primary-button full-width" type="submit">Konto erstellen</button>
      </form>
    </section>

    <div id="authMessage" class="message" role="status" aria-live="polite"></div>
    <a class="back-link" href="/">← Zurück zur Website</a>
  </main>

  <script src="/admin/admin.js?v=20261107-login-fix" defer></script>
</body>
</html>
