<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ULTOR ESPORTS – CMS Login</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="/">ULTOR <span>ESPORTS</span></a>
    <p class="eyebrow">CONTENT MANAGEMENT SYSTEM</p>

    <div class="auth-tabs">
      <button class="tab-button active" id="loginTab" type="button">
        Anmelden
      </button>
      <button class="tab-button" id="registerTab" type="button">
        Registrieren
      </button>
    </div>

    <form id="loginForm">
      <h1>Willkommen zurück.</h1>
      <p class="muted">Melde dich mit deinem CMS-Konto an.</p>

      <label for="loginEmail">E-Mail-Adresse</label>
      <input
        id="loginEmail"
        name="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="loginPassword">Passwort</label>
      <input
        id="loginPassword"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button class="primary-button full-width" type="submit">
        Anmelden
      </button>
    </form>

    <form id="registerForm" hidden>
      <h1>CMS-Zugang erstellen.</h1>
      <p class="muted">
        Neue Konten müssen zunächst vom Owner freigegeben werden.
      </p>

      <label for="registerName">Name</label>
      <input
        id="registerName"
        name="name"
        type="text"
        autocomplete="name"
        required
        maxlength="100"
      >

      <label for="registerEmail">E-Mail-Adresse</label>
      <input
        id="registerEmail"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="registerPassword">Passwort</label>
      <input
        id="registerPassword"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button class="primary-button full-width" type="submit">
        Konto erstellen
      </button>
    </form>

    <div
      id="authMessage"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <a class="back-link" href="/">
      ← Zurück zur Website
    </a>
  </main>

  <script src="admin.js" defer></script>
</body>
</html>
